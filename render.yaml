# Supabase is configured separately; this file creates no paid Render resources.
services:
  - type: web
    name: comicklu-1
    runtime: docker
    repo: https://github.com/Yamilethklu/comicklu
    branch: main
    region: ohio
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: comicklu-media
      - key: UPLOAD_DIR
        value: /tmp/comicklu-uploads
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: AI_PROVIDER
        value: free
