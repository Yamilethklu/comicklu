# Review the paid compute, database and disk costs in Render before applying.
services:
  - type: web
    name: comicklu
    runtime: docker
    repo: https://github.com/Yamilethklu/comicklu
    branch: main
    plan: standard
    healthCheckPath: /api/health
    disk:
      name: comicklu-media
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: comicklu-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: AI_PROVIDER
        value: free

databases:
  - name: comicklu-db
    databaseName: comicklu
    user: comicklu
    plan: basic-256mb
    ipAllowList: []
