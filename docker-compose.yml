services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comicdb
      POSTGRES_USER: comic
      POSTGRES_PASSWORD: comic
    ports:
      - "5432:5432"
    volumes:
      - comicklu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comic -d comicdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  comicklu-postgres-data:
